<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern English Quiz</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
    </div>

    <div class="container">
        <!-- Start Screen -->
        <div id="start-screen" class="screen active">
            <h1 class="title">English Proficiency<br><span class="highlight">Test</span></h1>
            <p class="description">Challenge yourself with our modern interactive English quiz. Are you ready?</p>
            <button id="start-btn" class="btn primary-btn">Start Quiz</button>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="screen">
            <div class="quiz-header">
                <div class="header-top">
                    <div id="timer" class="timer">15:00</div>
                    <div class="stats">
                        <span id="question-count">Question 1/10</span>
                    </div>
                </div>
                <div class="progress-bar">
                    <div class="progress" id="progress"></div>
                </div>

                <div class="question-card">
                    <h2 id="question-text">Question goes here?</h2>
                    <div class="options-container" id="options-container">
                        <!-- Options will be generated here -->
                    </div>

                    <div class="navigation-controls">
                        <button id="prev-btn" class="btn nav-btn" disabled>Previous</button>
                        <button id="next-btn" class="btn nav-btn">Next</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="screen">
            <div class="result-card">
                <div class="score-circle">
                    <span id="final-score">0</span>
                    <span class="total">/ 10</span>
                </div>
                <h2>Quiz Completed!</h2>
                <p id="feedback-text">Good job!</p>
                <div class="result-buttons">
                    <button id="review-btn" class="btn secondary-btn">Review Answers</button>
                    <button id="restart-btn" class="btn primary-btn">Try Again</button>
                </div>
            </div>
        </div>

        <!-- Review Screen -->
        <div id="review-screen" class="screen">
            <h2 class="review-title">Review Answers</h2>
            <div id="review-container">
                <!-- Review items will be generated here -->
            </div>
            <button id="back-to-result-btn" class="btn primary-btn sticky-btn">Back to Result</button>
        </div>

        <script src="script.js"></script>
</body>

</html>
