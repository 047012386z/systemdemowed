<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Keeper</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="app-header">
        <div class="logo">
            <i class="fa-solid fa-database"></i>
            <h1>Data Keeper</h1>
        </div>
        <div class="controls">
            <!-- Search or other controls could go here -->
        </div>
    </header>

    <main class="container">
        <div class="topics-grid" id="topicsGrid">
            <!-- Topics will be injected here by JS -->
        </div>

        <div class="empty-state" id="emptyState" style="display: none;">
            <i class="fa-regular fa-folder-open"></i>
            <p>No topics yet. Create one to get started!</p>
        </div>
    </main>

    <!-- FAB -->
    <button class="fab" id="createTopicBtn" title="Create New Topic">
        <i class="fa-solid fa-plus"></i>
    </button>

    <!-- Modals -->
    <div class="modal-overlay" id="modalOverlay"></div>

    <!-- Create Topic Modal -->
    <div class="modal" id="topicModal">
        <div class="modal-header">
            <h2>New Topic</h2>
            <button class="close-btn" data-close="topicModal"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label for="topicName">Topic Name</label>
                <input type="text" id="topicName" placeholder="e.g., Work Project, Ideas...">
            </div>
            <div class="form-group">
                <label for="topicDesc">Description (Optional)</label>
                <textarea id="topicDesc" rows="3" placeholder="Short description..."></textarea>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" data-close="topicModal">Cancel</button>
            <button class="btn btn-primary" id="saveTopicBtn">Create Topic</button>
        </div>
    </div>

    <!-- View Topic Modal (Full Screen-ish) -->
    <div class="modal modal-lg" id="viewModal">
        <div class="modal-header">
            <h2 id="viewTopicTitle">Topic Title</h2>
            <div class="view-controls">
                <button class="btn-icon danger" id="deleteTopicBtn" title="Delete Topic"><i
                        class="fa-solid fa-trash"></i></button>
                <button class="close-btn" data-close="viewModal"><i class="fa-solid fa-xmark"></i></button>
            </div>
        </div>
        <div class="modal-subheader">
            <p id="viewTopicDesc">Topic description goes here...</p>
        </div>
        <div class="modal-body scrollable">
            <div class="content-list" id="contentList">
                <!-- Content items injected here -->
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-primary" id="addContentBtn"><i class="fa-solid fa-plus"></i> Add Content</button>
        </div>
    </div>

    <!-- Add Content Modal -->
    <div class="modal" id="contentModal">
        <div class="modal-header">
            <h2>Add Content</h2>
            <button class="close-btn" data-close="contentModal"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="modal-body">
            <div class="tabs">
                <button class="tab-btn active" data-tab="text">Text</button>
                <button class="tab-btn" data-tab="file">File</button>
            </div>

            <div class="tab-content active" id="tab-text">
                <div class="form-group">
                    <label for="contentText">Content</label>
                    <textarea id="contentText" rows="5" placeholder="Write something..."></textarea>
                </div>
            </div>

            <div class="tab-content" id="tab-file">
                <div class="file-drop-area" id="fileDropArea">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                    <p>Click or Drag file here</p>
                    <input type="file" id="fileInput" hidden>
                    <div id="filePreview" class="file-preview"></div>
                </div>

                <div class="form-group" style="margin-top: 1rem;">
                    <label for="fileDesc">File Description (Optional)</label>
                    <textarea id="fileDesc" rows="2" placeholder="Add details about this file..."></textarea>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" data-close="contentModal">Cancel</button>
            <button class="btn btn-primary" id="saveContentBtn">Save</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
